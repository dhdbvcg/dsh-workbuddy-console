# Register dsh-workbuddy-console as ONE plugin that provides both roles:
#
#   - llm-workbuddy-xdpool : the model pool provider (formerly a separate plugin)
#   - workbuddy-console    : the console page + skill market
#
# Both ids point at THIS package: the provider role is implemented by the
# vendored xdpool runtime (vendor/xdpool/lib/index.js, MIT, (c) XDTrees —
# see vendor/xdpool/LICENSE-ORIGINAL), which lib/index.js forwards to.
#
# The llm-workbuddy-xdpool id must keep its exact name: the account-pool
# settings card looks itself up by it to find its settings scope.
#
# Why one plugin instead of two:
#   they share the same credential discovery, the same account pool and the
#   same web server; splitting them meant two settings entries, two enable
#   toggles and two things to keep in sync for no benefit.
#
# NOTE: YAML comments are '#' only — a previous revision used "/** */"
# (JavaScript block-comment syntax) here, which is not a comment in YAML and
# broke parsing: "end of the stream or a document separator is expected".
- insert:
    - id: llm-workbuddy-xdpool
      name: dsh-workbuddy-console
    - id: workbuddy-console
      name: dsh-workbuddy-console
