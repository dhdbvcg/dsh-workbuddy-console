<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WorkBuddy 账号管理器 · XD Pool</title>
<link rel="stylesheet" href="/wb-console/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">WB</span>
    <div>
      <h1>WorkBuddy 账号管理器</h1>
      <p class="sub" id="mode-line">连接中…</p>
    </div>
  </div>
  <div class="actions">
    <button id="btn-claim-all" class="btn btn-primary" disabled>
      <span class="ico">⚡</span> 一键全部签到
    </button>
    <button id="btn-check" class="btn">检查账号</button>
    <button id="btn-login" class="btn">登录新账号</button>
    <button id="btn-rescan" class="btn">重扫账号</button>
    <button id="btn-refresh" class="btn">刷新</button>
  </div>
</header>

<main>
  <div id="banner" class="banner hidden"></div>
  <div id="alert" class="alert hidden"></div>

  <!-- 账号体检结果 -->
  <section class="panel hidden" id="check-panel">
    <div class="panel-head">
      <h2>账号检查</h2>
      <span class="hint" id="check-time"></span>
    </div>
    <div id="check-body"></div>
  </section>

  <section id="summary" class="summary hidden">
    <div class="stat"><span class="k">账号总数</span><b id="s-total">0</b></div>
    <div class="stat ok"><span class="k">本次签到成功</span><b id="s-claimed">0</b></div>
    <div class="stat"><span class="k">今日已签</span><b id="s-already">0</b></div>
    <div class="stat bad"><span class="k">失败</span><b id="s-failed">0</b></div>
    <div class="stat gain"><span class="k">本次共获得</span><b id="s-credit">0</b><span class="unit">积分</span></div>
  </section>

  <!-- 未完成任务 -->
  <section class="panel" id="tasks-panel">
    <div class="panel-head">
      <h2>未完成任务</h2>
      <div class="chips">
        <span class="badge warn" id="tasks-pending-badge">—</span>
        <span class="badge gain" id="tasks-credit-badge">—</span>
        <button class="btn btn-sm" id="btn-tasks">刷新任务</button>
      </div>
    </div>
    <div id="tasks-body"><p class="hint" style="padding:0 18px 14px">点「刷新任务」读取各账号的成长任务进度。</p></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>账号池</h2>
      <div class="chips" id="pool-chips"></div>
    </div>
    <div id="list" class="list"></div>
    <div id="empty" class="empty hidden">
      <p>没有发现账号。</p>
      <p class="hint">请先在 WorkBuddy 桌面端登录，然后点「重扫账号」。</p>
    </div>
  </section>

  <section class="panel" id="automation-panel">
    <div class="panel-head">
      <h2>自动化任务</h2>
      <span class="hint" id="auto-state"></span>
    </div>
    <div class="jobs" id="jobs"></div>
    <p class="hint" id="auto-hint"></p>
  </section>

  <section class="panel" id="models-panel">
    <div class="panel-head">
      <h2>模型池</h2>
      <button class="btn btn-sm" id="btn-models-refresh">刷新目录</button>
    </div>
    <div id="models" class="models"></div>
  </section>
</main>

<!-- 保底积分弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3>设置保底积分</h3>
    <p class="hint" id="reserve-target"></p>
    <label>当账号积分低于该值时停止使用它（0 = 不限制）</label>
    <input id="f-reserve" type="number" min="0" step="1" value="0" />
    <div class="modal-actions">
      <button id="btn-cancel" class="btn">取消</button>
      <button id="btn-save" class="btn btn-primary">保存</button>
    </div>
  </div>
</div>

<!-- 登录弹窗 -->
<div id="login-modal" class="modal hidden">
  <div class="modal-box">
    <h3>登录新的 WorkBuddy 账号</h3>
    <p class="hint">
      登录必须由你本人在浏览器里完成（官方用的是交互式 OAuth），
      本工具不会存储或代填你的账号密码。
    </p>
    <div class="login-choices">
      <button class="btn login-choice" id="btn-login-web">
        <b>打开官网登录页</b>
        <span class="hint">在浏览器里登录 WorkBuddy 网页版，登录后回来点「重扫账号」</span>
      </button>
      <button class="btn login-choice" id="btn-login-desktop">
        <b>拉起 WorkBuddy 桌面版</b>
        <span class="hint">桌面版已登录时会重新写出登录文件，无需再输密码</span>
      </button>
    </div>
    <p class="hint" id="login-result"></p>
    <div class="modal-actions">
      <button id="btn-login-cancel" class="btn">关闭</button>
    </div>
  </div>
</div>

<script src="/wb-console/app.js"></script>
</body>
</html>
